entryPoints:
  web:
    address: :80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: :443

providers:
  file:
    filename: routes.yaml

certificatesResolvers:
  letsencrypt:
    acme:
      storage: acme.json
      dnsChallenge:
        provider: cloudflare
